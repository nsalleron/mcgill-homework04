[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "MLOps Agentic RAG Knowledge Assistant with CrewAI and Langfuse"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.5.0",
    "crewai[bedrock]>=0.80.0",
    "botocore[crt]",
    "langfuse>=2.50.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
